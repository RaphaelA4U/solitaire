[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solitaire-tui"
version = "1.4.0"
description = "Klondike solitaire in your terminal: mouse, keyboard, drag and drop, hints, undo"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
solitaire = "solitaire_app.__main__:main"

[tool.setuptools.packages.find]
include = ["solitaire_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
